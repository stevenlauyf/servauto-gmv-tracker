<title>October GMV Tracker</title>
<style>
  :root { --bg: #f7f6f2; --panel: #fff; --fg: #1f1e1b; --muted: #6b6860; --line: #e3e0d8; --bad: #b42318; color-scheme: light; }

  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  input, button { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button { background: var(--fg); color: var(--bg); border-color: var(--fg); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--bad); min-height: 1.2em; font-size: 14px; }
</style>

      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BOX.iv) }, key, b64(BOX.data)).then(function () {
        if (!keep) return;
        return crypto.subtle.exportKey('raw', key).then(function (raw) { try { localStorage.setItem(STORE, BOX.salt + ':' + toB64(raw)); } catch (x) {} });
      }).then(function () { return open(key); });
    }).catch(function () { go.disabled = false; err.textContent = 'Wrong passcode · 密码错误'; });
  });
  function start() {
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (x) {}
  if (saved && saved.split(':')[0] === BOX.salt && window.crypto && crypto.subtle) {
    crypto.subtle.importKey('raw', b64(saved.split(':')[1]), 'AES-GCM', true, ['decrypt']).then(open).catch(function () {
      try { localStorage.removeItem(STORE); } catch (x) {}
      ask();
    });
  } else ask();
  }
  // Wait until this page has finished loading so the dashboard fully replaces it.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(start, 0); }); else setTimeout(start, 0);
})();
