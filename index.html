<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>October GMV Tracker</title>
<style>
  :root { --bg: #f7f6f2; --panel: #fff; --fg: #1f1e1b; --muted: #6b6860; --line: #e3e0d8; --bad: #b42318; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #191917; --panel: #23221f; --fg: #eceae4; --muted: #a29f96; --line: #3a3833; --bad: #f0766b; color-scheme: dark; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: min(100%, 360px); box-sizing: border-box; display: grid; gap: 12px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  input, button { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button { background: var(--fg); color: var(--bg); border-color: var(--fg); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--bad); min-height: 1.2em; font-size: 14px; }
</style>
</head>

</main>
